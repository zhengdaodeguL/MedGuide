# Every visitor reaches this UI through the InstaBox platform proxy on
# the host loopback, so $remote_addr is the same Docker gateway address
# for all of them: a $binary_remote_addr zone would put every visitor
# in one shared 30r/m bucket (issue #27). Key the business-API zone on
# the server-issued session cookie instead — the API sets it on login
# (secrets.token_urlsafe(32), HttpOnly, Secure, SameSite=Strict), so
# one cookie means one account and a client cannot claim another
# account's key without that account's session. Requests without a
# cookie (anonymous) fall back to the shared remote address; they are
# rejected by the auth subrequest anyway. The cookie name below must
# match MEDGUIDE_AUTH_COOKIE_NAME in the demo/local compose files
# (both set it to medguide_session); if it ever changes there, change
# it here too, or the key silently degrades to the shared bucket.
# Do NOT use X-Forwarded-For here: the platform proxy forwards
# arbitrary public XFF, which is not an identity (see the note above
# the probe map), and this deployment never builds identity from
# client-supplied headers.
map $cookie_medguide_session $medguide_api_key {
    "" $binary_remote_addr;
    default $cookie_medguide_session;
}

limit_req_zone $medguide_api_key zone=medguide_api:10m rate=30r/m;
# Login/register are anonymous by definition, so there is no
# server-issued identity to key on here: the cookie does not exist
# yet and X-Forwarded-For is not trusted in this deployment (see
# above). Brute-force protection for these endpoints is the backend's
# per-account login lockout; the shared remote-address bucket only
# bounds the aggregate anonymous rate.
limit_req_zone $binary_remote_addr zone=medguide_auth:10m rate=6r/m;

# Only the image's loopback health checks may reach the probe endpoints.
# Do not enable real_ip_header here: arbitrary public XFF is not an identity.
map $remote_addr $medguide_local_probe {
    default 0;
    127.0.0.1 1;
    ::1 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Instabox terminates TLS before this loopback-published HTTP listener.
    # Only expose it through that HTTPS entry, never directly on the Internet.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /_health {
        if ($medguide_local_probe = 0) {
            return 404;
        }
        access_log off;
        return 204;
    }

    location = /_api-ready {
        if ($medguide_local_probe = 0) {
            return 404;
        }
        access_log off;
        proxy_pass http://medguide-api:8000/api/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /api/health {
        return 404;
    }

    location = /api/ready {
        return 404;
    }

    # Offline mode has no API authentication gate of its own. Check the
    # HttpOnly account cookie before allowing any business API request.
    location = /_auth {
        internal;
        proxy_pass http://medguide-api:8000/api/auth/me;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header X-API-Key "";
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ ^/api/auth/(login|register)$ {
        auth_request off;
        limit_req zone=medguide_auth burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://medguide-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    location /api/auth/ {
        auth_request off;
        proxy_pass http://medguide-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    location /api/ {
        auth_request /_auth;
        limit_req zone=medguide_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://medguide-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Keep the original request on the same cookie-only identity path as
        # the auth subrequest; offline service headers must never bypass it.
        proxy_set_header Authorization "";
        proxy_set_header X-API-Key "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
