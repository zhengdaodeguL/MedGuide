name: medguide

services:
  medguide-llm:
    # llama.cpp b12242 CPU build; pin the verified multi-platform manifest.
    image: ghcr.io/ggml-org/llama.cpp@sha256:4d2de15a0ffbce704777c64026b40512a71e0bbc0b303a5fe5ea9bf71760dff9
    command:
      - --model
      - /models/Qwen3-1.7B-Q8_0.gguf
      - --alias
      - medguide-local-qwen3-1.7b
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --n-gpu-layers
      - "0"
      - --threads
      - "3"
      - --threads-batch
      - "3"
      - --parallel
      - "1"
      - --ctx-size
      - "4096"
      - --batch-size
      - "256"
      - --ubatch-size
      - "128"
      - --predict
      - "512"
      - --cache-ram
      - "0"
      - --jinja
      - --reasoning
      - "off"
      - --chat-template-kwargs
      - '{"enable_thinking":false}'
    expose:
      - "8080"
    volumes:
      - type: bind
        source: ${MEDGUIDE_MODEL_DIR:?Set MEDGUIDE_MODEL_DIR to the verified persistent model directory}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 4g
    cpus: 3.0
    pids_limit: 128
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5

  medguide-api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    environment:
      # Only the internal model service is configured. Do not inherit OPENAI_*.
      MEDGUIDE_MODE: local
      MEDGUIDE_LOCAL_LLM_BASE_URL: http://medguide-llm:8080/v1
      MEDGUIDE_LOCAL_LLM_MODEL: medguide-local-qwen3-1.7b
      MEDGUIDE_LOCAL_LLM_TIMEOUT_SECONDS: "120"
      MEDGUIDE_LOCAL_LLM_MAX_TOKENS: "512"
      MEDGUIDE_KNOWLEDGE_BACKEND: bm25
      MEDGUIDE_AUTH_BACKEND: sqlite
      MEDGUIDE_AUTH_DB_PATH: /app/data/runtime/auth.sqlite3
      MEDGUIDE_AUTH_SESSION_TTL_SECONDS: "604800"
      MEDGUIDE_AUTH_COOKIE_NAME: medguide_session
      MEDGUIDE_COOKIE_SECURE: "true"
      MEDGUIDE_REQUIRE_HTTPS: "true"
      MEDGUIDE_CORS_ORIGINS: ""
      MEDGUIDE_SESSION_TTL_SECONDS: "86400"
      MEDGUIDE_NETWORK_SUBNET: ${MEDGUIDE_NETWORK_SUBNET:-172.30.90.0/24}
      MEDGUIDE_API_TRUSTED_PROXY_CIDR: ${MEDGUIDE_NETWORK_SUBNET:-172.30.90.0/24}
      BM25_INDEX_PATH: /app/data/runtime/bm25-index.json
    expose:
      - "8000"
    volumes:
      - type: bind
        source: ${MEDGUIDE_RUNTIME_DIR:?Set MEDGUIDE_RUNTIME_DIR to the existing persistent account directory}
        target: /app/data/runtime
        bind:
          create_host_path: false
    command: [uvicorn, "app.main:app", --host, 0.0.0.0, --port, "8000", --no-proxy-headers, --workers, "1"]
    depends_on:
      medguide-llm:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g

  medguide-ui:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    environment:
      MEDGUIDE_NETWORK_SUBNET: ${MEDGUIDE_NETWORK_SUBNET:-172.30.90.0/24}
      MEDGUIDE_TRUSTED_PROXY_CIDR: ${MEDGUIDE_NETWORK_SUBNET:-172.30.90.0/24}
      MEDGUIDE_REQUIRE_HTTPS: "true"
      NGINX_ENVSUBST_FILTER: "^MEDGUIDE_(TRUSTED_PROXY_CIDR|REQUIRE_HTTPS)"
    ports:
      - "${MEDGUIDE_BIND_ADDRESS:-127.0.0.1}:8080:80"
    volumes:
      - type: bind
        source: ./nginx.demo.conf
        target: /etc/nginx/templates/default.conf.template
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      medguide-api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m

networks:
  default:
    ipam:
      config:
        - subnet: ${MEDGUIDE_NETWORK_SUBNET:-172.30.90.0/24}
